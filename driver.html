<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BURAQ — kamera</title>
<link rel="stylesheet" href="css/design-system.css">
<!-- Мини-приложение Telegram: бот открывает эту страницу кнопкой «📷 Сфотографировать».
     Только камера (не галерея), штамп на фото (BL, дата, время, координаты), снимок — в скрипт Google Таблицы
     с подписью Telegram (initData), скрипт проверяет её токеном бота. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  .cam-head { background: var(--color-brand); padding: 12px 16px; border-bottom: 2px solid var(--color-red); }
  .cam-head img { height: 30px; display: block; }
  .cam { padding: 16px; display: flex; flex-direction: column; gap: 12px; max-width: 560px; margin: 0 auto; }
  .cam-title { font-family: var(--font-heading); font-size: 26px; text-transform: uppercase; line-height: 1.1; margin: 0; }
  .cam-sub { font-size: 14px; color: var(--color-neutral-700); }
  .cam-gps { font-size: 13px; color: var(--color-neutral-700); }
  .cam-big { width: 100%; padding: 16px; font-size: 18px; }
  .cam-row { display: flex; gap: 8px; }
  .cam-row .btn { flex: 1; padding: 12px; font-size: 16px; }
  #cv { width: 100%; height: auto; border: 1px solid var(--color-divider); display: block; }
  .cam-msg { font-size: 14px; padding: 10px 12px; border-left: 2px solid var(--color-accent); background: var(--color-surface); white-space: pre-line; }
  .cam-msg.err { border-left-color: var(--color-red); }
  .cam-msg:empty { display: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="cam-head"><img src="buraq-brand/logo/buraq-logo-white.svg" alt="BURAQ logistics"></header>
<main class="cam">
  <h1 class="cam-title" id="title"></h1>
  <div class="cam-sub" id="sub"></div>
  <div class="cam-gps" id="gps"></div>
  <button class="btn btn-primary cam-big" id="shot" type="button"></button>
  <input id="file" type="file" accept="image/*" capture="environment" hidden>
  <div id="preview" hidden>
    <canvas id="cv"></canvas>
    <div class="cam-row" style="margin-top:8px"><button class="btn btn-secondary" id="retake" type="button"></button><button class="btn btn-primary" id="send" type="button"></button></div>
  </div>
  <div class="cam-msg" id="msg" role="status"></div>
  <button class="btn btn-secondary cam-big" id="done" type="button" hidden></button>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search), L = q.get('l') === 'ru' ? 'ru' : 'uz';
  var T = {
    uz: { title: 'Suratga olish', ok: 'Yetkazilgan yuk', fail: 'Manzil (yetkazilmadi)', shot: '📷 Suratga olish', retake: '↩️ Qayta', send: '✅ Yuborish', done: '✅ Tayyor — botga qaytish',
      gpsWait: '📍 Joylashuv aniqlanmoqda…', gpsOk: '📍 Joylashuv: ±{acc} m', gpsNo: '📍 Joylashuv yo‘q — botda alohida so‘raladi',
      gallery: 'Bu rasm galereyadan ({age}). Yangi rasm oling — faqat kamera orqali.', sending: 'Yuborilmoqda…', sent: '✅ Rasm yuborildi: {n}. Yana olishingiz yoki «Tayyor» tugmasini bosishingiz mumkin.',
      noTg: 'Bu sahifa botdagi «📷 Suratga olish» tugmasi orqali ochiladi.', bad: 'Havola noto‘g‘ri. Botdagi tugmani qayta bosing.', net: 'Internet yo‘q yoki javob kelmadi. Qayta urinib ko‘ring.', min: '{n} daqiqa oldin', day: '{n} kun oldin' },
    ru: { title: 'Фото', ok: 'Доставленный груз', fail: 'Место (не доставлено)', shot: '📷 Сфотографировать', retake: '↩️ Переснять', send: '✅ Отправить', done: '✅ Готово — вернуться в бот',
      gpsWait: '📍 Определяю место…', gpsOk: '📍 Место: ±{acc} м', gpsNo: '📍 Места нет — бот спросит геолокацию отдельно',
      gallery: 'Это фото из галереи ({age}). Сделайте новое — только камерой.', sending: 'Отправляю…', sent: '✅ Фото отправлено: {n}. Можно сделать ещё или нажать «Готово».',
      noTg: 'Эта страница открывается кнопкой «📷 Сфотографировать» в боте.', bad: 'Неверная ссылка. Нажмите кнопку в боте ещё раз.', net: 'Нет интернета или нет ответа. Попробуйте ещё раз.', min: '{n} мин назад', day: '{n} дн. назад' }
  }[L];
  var tx = function (k, v) { var s = T[k]; Object.keys(v || {}).forEach(function (x) { s = s.split('{' + x + '}').join(v[x]); }); return s; };
  var $ = function (id) { return document.getElementById(id); };
  var TW = window.Telegram && window.Telegram.WebApp, init = TW ? TW.initData : '';
  var url = q.get('s') || '', key = q.get('k') || '', bl = q.get('bl') || '', mode = q.get('m') === 'fail' ? 'fail' : 'ok';
  document.documentElement.lang = L;
  $('title').textContent = bl || T.title; $('sub').textContent = T[mode];
  $('shot').textContent = T.shot; $('retake').textContent = T.retake; $('send').textContent = T.send; $('done').textContent = T.done;
  var msg = function (t, err) { $('msg').textContent = t || ''; $('msg').className = 'cam-msg' + (err ? ' err' : ''); };
  if (TW) { try { TW.ready(); TW.expand(); } catch (e) {} }
  // снимок уходит только в скрипт Google Таблицы: подпись Telegram — не для чужих адресов
  if (!/^https:\/\/script\.google\.com\/(a\/macros\/[^\/]+|macros)\/s\/[\w-]+\/exec$/.test(url) || !key) { msg(T.bad, true); $('shot').disabled = true; return; }
  if (!init) { msg(T.noTg, true); $('shot').disabled = true; return; }

  // ── место: сначала Telegram (LocationManager), иначе браузер ──
  var pos = null;
  $('gps').textContent = T.gpsWait;
  var setPos = function (lat, lon, acc) { pos = { ll: [+lat.toFixed(6), +lon.toFixed(6)], acc: Math.round(acc || 0) }; $('gps').textContent = tx('gpsOk', { acc: pos.acc || '?' }); };
  var browserGps = function () {
    if (!navigator.geolocation) { $('gps').textContent = T.gpsNo; return; }
    navigator.geolocation.watchPosition(function (p) { setPos(p.coords.latitude, p.coords.longitude, p.coords.accuracy); }, function () { if (!pos) $('gps').textContent = T.gpsNo; }, { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 });
  };
  var LM = TW && TW.LocationManager;
  if (LM && typeof LM.init === 'function') {
    try { LM.init(function () { if (LM.isLocationAvailable) LM.getLocation(function (d) { if (d) setPos(d.latitude, d.longitude, d.horizontal_accuracy); else browserGps(); }); else browserGps(); }); }
    catch (e) { browserGps(); }
  } else browserGps();

  // ── дата съёмки из EXIF (DateTimeOriginal): фото из галереи — старое ──
  function exifDate(buf) {
    try {
      var v = new DataView(buf), o = 2;
      if (v.getUint16(0) !== 0xFFD8) return null;
      while (o + 4 < v.byteLength) {
        var mk = v.getUint16(o), len = v.getUint16(o + 2);
        if (mk === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) {
          var t = o + 10, le = v.getUint16(t) === 0x4949, u16 = function (p) { return v.getUint16(t + p, le); }, u32 = function (p) { return v.getUint32(t + p, le); };
          var find = function (ifd, tag) { var n = u16(ifd); for (var i = 0; i < n; i++) { var e = ifd + 2 + i * 12; if (u16(e) === tag) return e; } return 0; };
          var str = function (e) { var n = u32(e + 4), p = n > 4 ? u32(e + 8) : e + 8, s = ''; for (var i = 0; i < n - 1; i++) s += String.fromCharCode(v.getUint8(t + p + i)); return s; };
          var ifd0 = u32(4), ex = find(ifd0, 0x8769), e = ex ? find(u32(ex + 8), 0x9003) : 0;
          if (!e) e = find(ifd0, 0x0132);
          if (!e) return null;
          var m = str(e).match(/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);
          return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]) : null;
        }
        if ((mk & 0xFF00) !== 0xFF00) return null;
        o += 2 + len;
      }
    } catch (e) {}
    return null;
  }
  var ago = function (ms) { var m = Math.round(ms / 60000); return m < 1440 ? tx('min', { n: m }) : tx('day', { n: Math.round(m / 1440) }); };
  var FRESH = 10 * 60000;

  var shots = 0, busy = false;
  $('shot').onclick = $('retake').onclick = function () { $('file').value = ''; $('file').click(); };
  $('done').onclick = function () { if (TW) TW.close(); };
  $('file').onchange = function () {
    var f = this.files && this.files[0];
    if (!f) return;
    msg('');
    f.slice(0, 262144).arrayBuffer().then(function (buf) {
      var shot = exifDate(buf), now = Date.now(), age = shot ? now - shot.getTime() : now - (f.lastModified || now);
      if (age > FRESH) { $('preview').hidden = true; msg(tx('gallery', { age: ago(age) }), true); return; }
      var img = new Image(), src = URL.createObjectURL(f);
      img.onload = function () {
        var k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k), cv = $('cv'), c = cv.getContext('2d');
        cv.width = w; cv.height = h; c.drawImage(img, 0, 0, w, h); URL.revokeObjectURL(src);
        // штамп: BL, дата и время, координаты — на тёмной полосе внизу
        var d = new Date(), p2 = function (n) { return String(n).padStart(2, '0'); }, fs = Math.max(16, Math.round(w / 34)), pad = Math.round(fs * 0.6);
        var lines = [bl + ' · ' + p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()),
          pos ? pos.ll[0].toFixed(5) + ', ' + pos.ll[1].toFixed(5) + (pos.acc ? ' ±' + pos.acc + (L === 'ru' ? ' м' : ' m') : '') : 'GPS —'];
        var bh = lines.length * fs * 1.35 + pad * 2, css = getComputedStyle(document.documentElement);
        c.globalAlpha = 0.72; c.fillStyle = css.getPropertyValue('--color-brand').trim() || '#0E2E54'; c.fillRect(0, h - bh, w, bh); c.globalAlpha = 1;
        c.fillStyle = css.getPropertyValue('--color-on-brand').trim() || '#FFFFFF'; c.font = '500 ' + fs + 'px Inter, sans-serif'; c.textBaseline = 'top';
        lines.forEach(function (t, i) { c.fillText(t, pad, h - bh + pad + i * fs * 1.35); });
        $('preview').hidden = false;
      };
      img.onerror = function () { msg(T.net, true); };
      img.src = src;
    });
  };
  $('send').onclick = function () {
    if (busy) return;
    busy = true; $('send').disabled = true; msg(T.sending);
    var img = $('cv').toDataURL('image/jpeg', 0.8);
    fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ tgphoto: { init: init, key: key, img: img, ll: pos ? pos.ll : null, acc: pos ? pos.acc : null } }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) throw new Error(j.error || T.net);
        shots = j.n; $('preview').hidden = true; $('done').hidden = false; msg(tx('sent', { n: shots }));
        if (TW && TW.HapticFeedback) try { TW.HapticFeedback.notificationOccurred('success'); } catch (e) {}
      })
      .catch(function (e) { msg((e && e.message) || T.net, true); })
      .then(function () { busy = false; $('send').disabled = false; });
  };
})();
</script>
</body>
</html>
