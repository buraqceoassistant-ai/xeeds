<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BURAQ — kamera</title>
<link rel="stylesheet" href="css/design-system.css">
<!-- Мини-приложение Telegram: бот открывает эту страницу кнопкой «📷 Сфотографировать».
     Камера включается прямо на странице (getUserMedia) — галереи нет. Штамп на фото: BL, дата, время, координаты.
     Снимок уходит в скрипт Google Таблицы с подписью Telegram (initData), скрипт проверяет её токеном бота.
     Если телефон не даёт камеру странице — запасной путь через камеру телефона (с проверкой даты снимка). -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  .cam-head { background: var(--color-brand); padding: 12px 16px; border-bottom: 2px solid var(--color-red); display: flex; align-items: center; gap: 12px; }
  .cam-head img { height: 28px; display: block; }
  .cam-head span { color: var(--color-on-brand); font-size: 13px; margin-left: auto; opacity: .85; }
  .cam { padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 12px; max-width: 560px; margin: 0 auto; }
  .cam-title { font-family: var(--font-heading); font-size: 24px; text-transform: uppercase; line-height: 1.1; margin: 0; }
  .cam-sub { font-size: 14px; color: var(--color-neutral-700); }
  .cam-line { font-size: 13px; color: var(--color-neutral-700); }
  .cam-view { position: relative; background: var(--color-brand); border: 1px solid var(--color-divider); min-height: 240px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .cam-view video, .cam-view canvas { width: 100%; height: auto; display: block; }
  .cam-view .cam-wait { color: var(--color-on-brand); font-size: 14px; padding: 24px; text-align: center; }
  .cam-shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid var(--color-bg); background: var(--color-red); box-shadow: 0 0 0 2px var(--color-red); margin: 4px auto 0; display: block; cursor: pointer; }
  .cam-shutter:active { transform: scale(.94); }
  .cam-shutter:disabled { background: var(--color-neutral-400); box-shadow: 0 0 0 2px var(--color-neutral-400); }
  .cam-row { display: flex; gap: 8px; }
  .cam-row .btn { flex: 1; padding: 14px; font-size: 18px; }
  .cam-row .cam-small { flex: 0 0 72px; }
  .cam-big { width: 100%; padding: 16px; font-size: 18px; }
  .cam-msg { font-size: 14px; padding: 10px 12px; border-left: 2px solid var(--color-accent); background: var(--color-surface); white-space: pre-line; }
  .cam-msg.err { border-left-color: var(--color-red); }
  .cam-msg:empty { display: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="cam-head"><img src="buraq-brand/logo/buraq-logo-white.svg" alt="BURAQ logistics"></header>
<main class="cam">
  <h1 class="cam-title"><span id="icon"></span> <span id="title"></span></h1>
  <div id="live">
    <div class="cam-view"><video id="video" playsinline muted autoplay></video><div class="cam-wait" id="wait"></div></div>
    <button class="cam-shutter" id="shutter" type="button" disabled></button>
  </div>
  <div id="preview" hidden>
    <div class="cam-view"><canvas id="cv"></canvas></div>
    <div class="cam-row" style="margin-top:10px"><button class="btn btn-secondary cam-small" id="retake" type="button"></button><button class="btn btn-primary" id="send" type="button"></button></div>
  </div>
  <div class="cam-msg" id="msg" role="status"></div>
  <div id="after" hidden>
    <button class="btn btn-primary cam-big" id="done" type="button"></button>
    <button class="btn btn-secondary cam-big" id="more" type="button" style="margin-top:8px"></button>
  </div>
  <div id="fallback" hidden>
    <button class="btn btn-secondary cam-big" id="retry" type="button"></button>
    <button class="btn btn-secondary cam-big" id="pick" type="button" style="margin-top:8px"></button>
  </div>
  <input id="file" type="file" accept="image/*" capture="environment" hidden>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search), L = q.get('l') === 'ru' ? 'ru' : 'uz';
  var T = {
    uz: { retake: '↩️', send: '✅ Yuborish', done: '✅ Tayyor', more: '📷 Yana rasm', camWait: 'Kamera yoqilmoqda…', sent: '✅ Yuborildi ({n})', locBot: '📍 Endi botda joylashuvni yuboring',
      camDenied: 'Kameraga ruxsat bering: Telegram so‘raganda «Ruxsat berish»ni bosing.', camNone: 'Kamera ochilmadi.', camBusy: 'Kamera band. Boshqa ilovani yoping.',
      retry: '🔄 Kamerani yoqish', pick: '📷 Telefon kamerasi',
      gallery: 'Galereyadagi rasm ({age}). Yangi rasm oling.', badImg: 'Rasm ochilmadi ({why}). Qayta oling.',
      sending: 'Yuborilmoqda…', noTg: 'Botdagi «📷 Suratga olish» tugmasini bosing.', bad: 'Botdagi tugmani qayta bosing.',
      net: 'Internet yo‘q. Qayta bosing.', badResp: 'Server xatosi (HTTP {code}). Qayta bosing.', min: '{n} daqiqa oldin', day: '{n} kun oldin' },
    ru: { retake: '↩️', send: '✅ Отправить', done: '✅ Готово', more: '📷 Ещё фото', camWait: 'Включаю камеру…', sent: '✅ Отправлено ({n})', locBot: '📍 Теперь отправьте геолокацию в боте',
      camDenied: 'Разрешите камеру: когда Telegram спросит — «Разрешить».', camNone: 'Камера не открылась.', camBusy: 'Камера занята. Закройте другое приложение.',
      retry: '🔄 Включить камеру', pick: '📷 Камера телефона',
      gallery: 'Фото из галереи ({age}). Сделайте новое.', badImg: 'Снимок не открылся ({why}). Переснимите.',
      sending: 'Отправляю…', noTg: 'Нажмите «📷 Сфотографировать» в боте.', bad: 'Нажмите кнопку в боте ещё раз.',
      net: 'Нет интернета. Нажмите ещё раз.', badResp: 'Ошибка сервера (HTTP {code}). Нажмите ещё раз.', min: '{n} мин назад', day: '{n} дн. назад' }
  }[L];
  var tx = function (k, v) { var s = T[k]; Object.keys(v || {}).forEach(function (x) { s = s.split('{' + x + '}').join(v[x]); }); return s; };
  var $ = function (id) { return document.getElementById(id); };
  var show = function (id, on) { $(id).hidden = !on; };
  var TW = window.Telegram && window.Telegram.WebApp, init = TW ? TW.initData : '';
  var url = q.get('s') || '', key = q.get('k') || '', bl = q.get('bl') || '', mode = q.get('m') === 'fail' ? 'fail' : 'ok';
  document.documentElement.lang = L;
  $('title').textContent = bl; $('icon').textContent = mode === 'fail' ? '🚪' : '📦';
  $('retake').textContent = T.retake; $('retake').setAttribute('aria-label', L === 'ru' ? 'Переснять' : 'Qayta olish');
  $('send').textContent = T.send; $('done').textContent = T.done; $('more').textContent = T.more;
  $('retry').textContent = T.retry; $('pick').textContent = T.pick; $('wait').textContent = T.camWait;
  $('shutter').setAttribute('aria-label', L === 'ru' ? 'Снять' : 'Rasmga olish');
  var msg = function (t, err) { $('msg').textContent = t || ''; $('msg').className = 'cam-msg' + (err ? ' err' : ''); };
  if (TW) { try { TW.ready(); TW.expand(); if (TW.disableVerticalSwipes) TW.disableVerticalSwipes(); } catch (e) {} }
  // снимок уходит только в скрипт Google Таблицы: подпись Telegram — не для чужих адресов
  if (!/^https:\/\/script\.google\.com\/(a\/macros\/[^\/]+|macros)\/s\/[\w-]+\/exec$/.test(url) || !key) { show('live', false); msg(T.bad, true); return; }
  if (!init) { show('live', false); msg(T.noTg, true); return; }

  // ── запрос к скрипту: JSON; сеть и непонятный ответ — разные сообщения ──
  var post = function (body) {
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ tgphoto: body }) })
      .then(function (r) { return r.text().then(function (t) { var j; try { j = JSON.parse(t); } catch (e) { j = null; } if (!j || typeof j !== 'object') throw new Error(tx('badResp', { code: r.status })); return j; }); },
        function () { throw new Error(T.net); });
  };
  // проверка связи сразу при открытии: скрипт узнаёт водителя и шаг «фото»
  post({ init: init, key: key, ping: 1 }).then(function (j) {
    if (j.ok || j.code === 'img') { if (j.n) { sentN = j.n; show('after', true); } }   // «img» — скрипт без проверки связи: связь есть
    else msg(j.error || T.net, true);
  }, function (e) { msg(e.message, true); });

  // ── место: сначала Telegram (LocationManager), иначе браузер ──
  var pos = null, sentN = 0, viaFile = false;   // место — молча: нет его — бот спросит геолокацию сам
  var setPos = function (lat, lon, acc) { pos = { ll: [+lat.toFixed(6), +lon.toFixed(6)], acc: Math.round(acc || 0) }; };
  var browserGps = function () {
    if (!navigator.geolocation) return;
    navigator.geolocation.watchPosition(function (p) { setPos(p.coords.latitude, p.coords.longitude, p.coords.accuracy); }, function () {}, { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 });
  };
  var LM = TW && TW.LocationManager;
  if (LM && typeof LM.init === 'function') {
    try { LM.init(function () { if (LM.isLocationAvailable) LM.getLocation(function (d) { if (d) setPos(d.latitude, d.longitude, d.horizontal_accuracy); else browserGps(); }); else browserGps(); }); }
    catch (e) { browserGps(); }
  } else browserGps();

  // ── штамп: BL, дата и время, координаты — на тёмной полосе внизу ──
  function stamp(c, w, h) {
    var d = new Date(), p2 = function (n) { return String(n).padStart(2, '0'); }, fs = Math.max(16, Math.round(w / 34)), pad = Math.round(fs * 0.6);
    var lines = [bl + ' · ' + p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()),
      pos ? pos.ll[0].toFixed(5) + ', ' + pos.ll[1].toFixed(5) + (pos.acc ? ' ±' + pos.acc + (L === 'ru' ? ' м' : ' m') : '') : 'GPS —'];
    var bh = lines.length * fs * 1.35 + pad * 2, css = getComputedStyle(document.documentElement);
    c.globalAlpha = 0.72; c.fillStyle = css.getPropertyValue('--color-brand').trim() || '#0E2E54'; c.fillRect(0, h - bh, w, bh); c.globalAlpha = 1;
    c.fillStyle = css.getPropertyValue('--color-on-brand').trim() || '#FFFFFF'; c.font = '500 ' + fs + 'px Inter, sans-serif'; c.textBaseline = 'top';
    lines.forEach(function (t, i) { c.fillText(t, pad, h - bh + pad + i * fs * 1.35); });
  }
  function toCanvas(src, sw, sh) {
    var k = Math.min(1, 1600 / Math.max(sw, sh)), w = Math.round(sw * k), h = Math.round(sh * k), cv = $('cv'), c = cv.getContext('2d');
    cv.width = w; cv.height = h; c.drawImage(src, 0, 0, w, h); stamp(c, w, h);
    show('live', false); show('after', false); show('preview', true); msg('');
  }

  // ── камера на странице: живое изображение и кнопка «Снять» — выбора из галереи нет ──
  var stream = null, video = $('video');
  function stopCam() { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  function startCam() {
    show('fallback', false); show('live', true); $('shutter').disabled = true; $('wait').hidden = false; $('wait').textContent = T.camWait; msg('');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camFail({ name: 'NotSupportedError' });
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false })
      .then(function (s) {
        stopCam(); stream = s; video.srcObject = s;
        var ready = function () { if (video.videoWidth) { $('wait').hidden = true; $('shutter').disabled = false; } };
        video.onloadedmetadata = ready; video.onplaying = ready;
        var pl = video.play(); if (pl && pl.catch) pl.catch(function () {});
      }, camFail);
  }
  function camFail(e) {
    var n = e && e.name;
    viaFile = true; $('wait').textContent = ''; show('live', false); show('fallback', true);
    msg(n === 'NotAllowedError' || n === 'SecurityError' ? T.camDenied : n === 'NotReadableError' || n === 'AbortError' ? T.camBusy : T.camNone, true);
  }
  $('shutter').onclick = function () {
    if (!video.videoWidth) return;
    toCanvas(video, video.videoWidth, video.videoHeight);
    if (TW && TW.HapticFeedback) try { TW.HapticFeedback.impactOccurred('medium'); } catch (e) {}
  };
  $('retake').onclick = function () { show('preview', false); msg(''); if (stream) show('live', true); else if (viaFile) { show('fallback', true); $('file').value = ''; $('file').click(); } else startCam(); };
  $('retry').onclick = startCam;
  var close = function () { stopCam(); if (TW) TW.close(); };
  $('done').onclick = function () {
    if (busy) return;
    busy = true; $('done').disabled = true; msg(T.sending);
    post({ init: init, key: key, done: 1 }).then(function (j) {
      if (j.ok) { if (j.needLoc) { msg(T.locBot); setTimeout(close, 1500); } else close(); return; }
      if (j.code === 'img' || j.code === 'stage') return close();   // скрипт без «Готово» из камеры или точка уже закрыта — «Готово» в боте
      msg(j.error || T.net, true);
    }, function (e) { msg(e.message, true); }).then(function () { busy = false; $('done').disabled = false; });
  };
  $('more').onclick = function () { show('after', false); msg(''); if (stream) show('live', true); else if (viaFile) { show('fallback', true); $('file').value = ''; $('file').click(); } else startCam(); };
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') stopCam(); else if (!$('live').hidden && !stream) startCam(); });

  // ── запасной путь: камера телефона через выбор файла; фото из галереи — по дате съёмки (EXIF) или файла ──
  function exifDate(buf) {
    try {
      var v = new DataView(buf), o = 2;
      if (v.getUint16(0) !== 0xFFD8) return null;
      while (o + 4 < v.byteLength) {
        var mk = v.getUint16(o), len = v.getUint16(o + 2);
        if (mk === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) {
          var t = o + 10, le = v.getUint16(t) === 0x4949, u16 = function (p) { return v.getUint16(t + p, le); }, u32 = function (p) { return v.getUint32(t + p, le); };
          var find = function (ifd, tag) { var n = u16(ifd); for (var i = 0; i < n; i++) { var e = ifd + 2 + i * 12; if (u16(e) === tag) return e; } return 0; };
          var str = function (e) { var n = u32(e + 4), p = n > 4 ? u32(e + 8) : e + 8, s = ''; for (var i = 0; i < n - 1; i++) s += String.fromCharCode(v.getUint8(t + p + i)); return s; };
          var ifd0 = u32(4), ex = find(ifd0, 0x8769), e = ex ? find(u32(ex + 8), 0x9003) : 0;
          if (!e) e = find(ifd0, 0x0132);
          if (!e) return null;
          var m = str(e).match(/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);
          return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]) : null;
        }
        if ((mk & 0xFF00) !== 0xFF00) return null;
        o += 2 + len;
      }
    } catch (e) {}
    return null;
  }
  var ago = function (ms) { var m = Math.round(ms / 60000); return m < 1440 ? tx('min', { n: m }) : tx('day', { n: Math.round(m / 1440) }); };
  var FRESH = 10 * 60000;
  var readHead = function (f) { return new Promise(function (res) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = function () { res(null); }; r.readAsArrayBuffer(f.slice(0, 262144)); }); };
  $('pick').onclick = function () { $('file').value = ''; $('file').click(); };
  $('file').onchange = function () {
    var f = this.files && this.files[0];
    if (!f) return;
    msg('');
    if (!f.size) return msg(tx('badImg', { why: L === 'ru' ? 'телефон передал пустой файл' : 'telefon bo‘sh fayl berdi' }), true);
    if (/hei[cf]/i.test(f.type || f.name)) return msg(tx('badImg', { why: 'HEIC' }), true);
    readHead(f).then(function (buf) {
      var shot = buf ? exifDate(buf) : null, now = Date.now(), age = shot ? now - shot.getTime() : now - (f.lastModified || now);
      if (age > FRESH) { show('preview', false); msg(tx('gallery', { age: ago(age) }), true); return; }
      var r = new FileReader();
      r.onload = function () {
        var img = new Image();
        img.onload = function () { toCanvas(img, img.naturalWidth, img.naturalHeight); };
        img.onerror = function () { msg(tx('badImg', { why: (f.type || '?') + ', ' + Math.round(f.size / 1024) + ' KB' }), true); };
        img.src = r.result;
      };
      r.onerror = function () { msg(tx('badImg', { why: L === 'ru' ? 'файл не читается' : 'fayl o‘qilmadi' }), true); };
      r.readAsDataURL(f);
    });
  };

  // ── отправка ──
  var busy = false;
  $('send').onclick = function () {
    if (busy) return;
    busy = true; $('send').disabled = true; msg(T.sending);
    post({ init: init, key: key, img: $('cv').toDataURL('image/jpeg', 0.8), ll: pos ? pos.ll : null, acc: pos ? pos.acc : null })
      .then(function (j) {
        if (!j.ok) throw new Error(j.error || T.net);
        sentN = j.n; show('preview', false); show('live', false); show('fallback', false); show('after', true); msg(tx('sent', { n: j.n }));
        if (TW && TW.HapticFeedback) try { TW.HapticFeedback.notificationOccurred('success'); } catch (e) {}
      })
      .catch(function (e) { msg(e.message || T.net, true); })
      .then(function () { busy = false; $('send').disabled = false; });
  };

  startCam();
})();
</script>
</body>
</html>
